schema_version: 1
tenant: milolika
service: milolika-hermes-gateway.service
host: hel1

release_policy:
  source_release: 59a840eb7165c4a2d9d169e8039cbd822df650ee
  install_scope: seya-only
  require_explicit_production_approval: true

workspace_overlay:
  source: tenant-overlays/seya/AGENTS.md
  destination: /home/milolika/workspace/AGENTS.md
  expected_sha256: f1185d1e0c7d8d84c3117357400f4b07c51b460083b429c092f3ae6c41b7f1e8

config_patch:
  agent:
    run_budget_seconds: 300
  tool_loop_guardrails:
    resume_after_no_progress_block: true
    hard_stop_after:
      idempotent_no_progress: 1
    additional_idempotent_tools:
      - mcp__seya__list_resources
      - mcp__seya__get_workshop
      - mcp__seya__get_section
      - mcp__seya__get_content_detail
  tools:
    tool_search:
      enabled: "off"
  environment:
    HERMES_AGENT_NOTIFY_INTERVAL: "75"

preserve:
  - delegation.child_timeout_seconds
  - tool_loop_guardrails.hard_stop_enabled
  - employee_auto_approval_policy
  - human20_mcp_credentials
  - employee_chipmanager_telegram_capability

rollback:
  release: 59a840eb7165c4a2d9d169e8039cbd822df650ee-seya-ready11
  restore_workspace_overlay_backup: true
  restore_config_backup: true
  restart_only: milolika-hermes-gateway.service
