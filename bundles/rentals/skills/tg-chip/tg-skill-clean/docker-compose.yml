services:
  # HTTP API - the single Telethon runtime for local scripts via REST endpoints
  telegram-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: telegram-api
    user: 1000:1000
    env_file:
      - .env
    environment:
      TELEGRAM_EXPORT_DIR: /opt/telegram-chip/exports
    ports:
      - 8080:8080
    volumes:
      - /opt/telegram-chip/exports:/opt/telegram-chip/exports
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://127.0.0.1:8080/health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
